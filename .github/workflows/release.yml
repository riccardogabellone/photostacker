name: Release

# A tag v<version> builds the packages on each of the four systems, checks them, and drafts
# a GitHub release with them, their SHA-256 checksums and build-provenance attestations
# (packaging/README.md, spec §11.3). A pull request that touches the packaging, and a run
# started by hand, build and check the packages too, without a release, so a packaging
# break shows before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "assets/icons/**"
      - "crates/ui/Cargo.toml"
      - "crates/ui/build.rs"
      - "scripts/**"
      - "Cargo.lock"
      - ".cargo/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per tag, branch or pull request; a newer push cancels an older run of a pull
# request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Windows build must embed the app's icon (crates/ui/build.rs).
  REQUIRE_WINDOWS_ICON: "1"

# Bash everywhere, Git Bash on Windows, as the scripts are. Every cargo starts in the
# repository's root, where it reads .cargo/config.toml: the build settings there are set by
# no step here.
defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the packages need only glibc 2.35.
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis,wix
          - os: macos-15
            formats: dmg
          - os: macos-15-intel
            formats: dmg
    runs-on: ${{ matrix.os }}
    # A cold build compiles the workspace and cargo-packager, and on Windows libheif with
    # vcpkg first.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.name == "photostacker-ui") | .version' | tr -d '\r')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, v and the workspace's version in Cargo.toml"
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is v and the version of photostacker-ui"

      # The build inputs of each system, as in the CI.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config nasm libde265-dev libegl1 zenity

      - name: Where vcpkg goes (Windows)
        id: vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        # The default root of scripts/windows-heif.ps1.
        run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$(Join-Path $env:LOCALAPPDATA 'photostacker\vcpkg')"
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg.outputs.root }}
          # The script pins the vcpkg commit and the two libraries' versions.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/windows-heif.ps1') }}
      - name: libheif and libde265 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # In this process, the script's output is the root alone; what it says goes to the host.
          $root = @(& ./scripts/windows-heif.ps1)[-1]
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "scripts/windows-heif.ps1 gave '$root', which is not a folder"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"

      - name: cmake and pkg-config (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          missing=
          command -v cmake >/dev/null 2>&1 || missing="$missing cmake"
          command -v pkg-config >/dev/null 2>&1 || missing="$missing pkgconf"
          if [ -n "$missing" ]; then
            echo "Installing with Homebrew:$missing"
            # shellcheck disable=SC2086 # one word per formula
            brew install $missing
          fi
          cmake --version | sed -n 1p
          echo "pkg-config $(pkg-config --version)"
      - name: Cache libde265 (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libde265
          # The script pins libde265's release; the build is for this runner's architecture.
          key: libde265-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/libde265.sh') }}
      - name: libde265 (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$RUNNER_TEMP/libde265"
          scripts/libde265.sh "$prefix"
          # libheif's cmake build finds the static libde265 there, and only there.
          echo "CMAKE_PREFIX_PATH=$prefix" >>"$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig" >>"$GITHUB_ENV"

      # The ONNX Runtime the packages carry: scripts/package.sh installs it through
      # scripts/ort.sh, into the folder cached here.
      - name: Where ONNX Runtime goes
        id: ort
        run: |
          library=$(scripts/ort.sh --where)
          if [ -z "$library" ]; then
            echo "::error::scripts/onnxruntime.tsv pins no ONNX Runtime build for this runner"
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            library=$(cygpath -u "$library")
          fi
          # The table's library is lib/<file>, in the folder the archive unpacks to.
          home=$(dirname "$(dirname "$library")")
          if [ "$RUNNER_OS" = Windows ]; then
            home=$(cygpath -w "$home")
          fi
          echo "home=$home" >>"$GITHUB_OUTPUT"
      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ort.outputs.home }}
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/onnxruntime.tsv') }}

      # The versions scripts/package.sh was written for. cargo-about's release binary has
      # its command line; install-action has no cargo-packager.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
          fallback: none
      - name: cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Packages
        run: scripts/package.sh "$FORMATS"
        env:
          FORMATS: ${{ matrix.formats }}

      # The package check reads the deployment target of the executables only, which a
      # static library compiled for a newer macOS would not change. libde265.sh checks
      # libde265's objects; this checks libheif's, which cmake built through libheif-sys.
      - name: libheif's objects need macOS 11.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          target=11.0
          archives=$(find target -path '*/build/libheif-sys-*/out/*' -name libheif.a 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "::error::found no libheif.a under target/*/build/libheif-sys-*/out/"
            exit 1
          fi
          status=0
          while IFS= read -r archive; do
            # Each object, with LC_BUILD_VERSION's minos or LC_VERSION_MIN_MACOSX's version;
            # a member with no load command (the symbol table) is no object.
            report=$(otool -l "$archive" | awk '
              function done() {
                if (member != "" && commands) print member, (minos == "" ? "none" : minos)
              }
              /\(.*\):$/ { done(); member = $0; sub(/^.*\(/, "", member); sub(/\):$/, "", member); commands = 0; minos = ""; next }
              $1 == "Load" && $2 == "command" { commands = 1 }
              $1 == "cmd" { cmd = $2 }
              minos == "" && cmd == "LC_BUILD_VERSION" && $1 == "minos" { minos = $2 }
              minos == "" && cmd == "LC_VERSION_MIN_MACOSX" && $1 == "version" { minos = $2 }
              END { done() }')
            objects=$(printf '%s\n' "$report" | grep -c . || true)
            wrong=$(printf '%s\n' "$report" | awk -v target="$target" '$2 != target')
            if [ "$objects" = 0 ]; then
              echo "::error::otool -l found no object in $archive"
              status=1
            elif [ -n "$wrong" ]; then
              echo "::error::objects in $archive need another macOS than $target (object, minimum macOS):"
              printf '%s\n' "$wrong"
              status=1
            else
              echo "ok: all $objects objects in $archive need macOS $target"
            fi
          done <<EOF
          $archives
          EOF
          exit "$status"

      # A runner is a throwaway machine: --install installs the .deb with apt-get and the
      # NSIS installer silently, and uninstalls both.
      - name: Check the packages
        run: scripts/smoke.sh --install dist/packages/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: dist/packages/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    # A tag pushed, never a pull request or a run by hand.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # The files by name, in byte order. The glob is expanded before the redirection
          # makes checksums.txt, so it does not list itself.
          export LC_ALL=C
          sha256sum -- * >checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # A draft: the packages are tried on each system before it is published by hand.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

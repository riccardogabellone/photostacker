name: Release

# A tag v<version> builds the packages on each of the four systems, checks them, and drafts
# a GitHub release with them, their SHA-256 checksums and build-provenance attestations
# (packaging/README.md, spec §11.3). A pull request that touches the packaging, and a run
# started by hand, build and check the packages too, without a release, so a packaging
# break shows before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "packaging/**"
      - "assets/icons/**"
      - "crates/ui/Cargo.toml"
      - "crates/ui/build.rs"
      # scripts/smoke.sh reads the lines `photostacker-cli info` prints, and the folders
      # they name are those the code looks in.
      - "crates/cli/src/info.rs"
      - "crates/core/src/package.rs"
      - "crates/core/src/models/runtime.rs"
      - "scripts/**"
      - "Cargo.lock"
      - ".cargo/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per tag, branch or pull request; a newer push cancels an older run of a pull
# request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Windows build must embed the app's icon (crates/ui/build.rs).
  REQUIRE_WINDOWS_ICON: "1"

# Bash everywhere, Git Bash on Windows, as the scripts are. Every cargo starts in the
# repository's root, where it reads .cargo/config.toml: the build settings there are set by
# no step here.
defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the packages need only glibc 2.35.
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis,wix
          - os: macos-15
            formats: dmg
          - os: macos-15-intel
            formats: dmg
    runs-on: ${{ matrix.os }}
    # A cold build compiles cargo-about, cargo-packager and the workspace, and on Windows
    # libheif with vcpkg first.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A commit of the action's `stable` branch, moved by hand: see ci.yml's lint job.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cargo does not build libheif again when only its toolchain file changes.
          key: libheif-${{ hashFiles('packaging/cmake/libheif.cmake') }}
          # A failed job keeps the tools and dependencies it built for the next run.
          cache-on-failure: true

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.name == "photostacker-ui") | .version' | tr -d '\r')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, v and the workspace's version in Cargo.toml"
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is v and the version of photostacker-ui"

      # The versions scripts/package.sh was written for, built from source the same way on
      # every system: cargo-about 0.9.3 has no release binary for Intel macOS, and
      # install-action has no cargo-packager. cargo-about's binary needs its `cli` feature.
      # They are built outside the repository and before the build inputs, so neither the
      # repository's .cargo/config.toml nor the macOS pkg-config path reaches their builds;
      # rust-cache keeps the installed binaries for later runs.
      - name: cargo-about and cargo-packager
        working-directory: ${{ runner.temp }}
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo install cargo-packager --version 0.11.8 --locked

      # The system's libraries, vcpkg or libde265, and ONNX Runtime, as in the CI.
      - uses: ./.github/actions/build-inputs

      - name: Packages
        run: scripts/package.sh "$FORMATS"
        env:
          FORMATS: ${{ matrix.formats }}

      # libde265.sh checks libde265's objects; this checks libheif's, which cmake built
      # through libheif-sys (scripts/macos-min.sh says why).
      - name: libheif's objects run on macOS 11.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          set --
          while IFS= read -r archive; do
            set -- "$@" "$archive"
          done < <(find target -path '*/build/libheif-sys-*/out/*' -name libheif.a 2>/dev/null || true)
          if [ "$#" = 0 ]; then
            echo "::error::found no libheif.a under target/*/build/libheif-sys-*/out/"
            exit 1
          fi
          scripts/macos-min.sh 11.0 "$@"

      # A runner is a throwaway machine: --install installs the .deb with apt-get and the
      # NSIS installer silently, and uninstalls both.
      - name: Check the packages
        run: scripts/smoke.sh --install dist/packages/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: dist/packages/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    # A tag pushed, never a pull request or a run by hand.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # The files by name, in byte order. The glob is expanded before the redirection
          # makes checksums.txt, so it does not list itself.
          export LC_ALL=C
          sha256sum -- * >checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # A draft: the packages are tried on each system before it is published by hand.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

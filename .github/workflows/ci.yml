name: CI

# Every pull request and every push to main: the format, the dependencies' licences and
# advisories, and on each of the four systems the releases ship for, the lints, the tests
# and a release build (spec §11.2).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch or pull request; a newer push cancels an older run of a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Windows build must embed the app's icon (crates/ui/build.rs).
  REQUIRE_WINDOWS_ICON: "1"

# Bash everywhere, Git Bash on Windows, so one script serves every system. Every cargo
# starts in the repository's root, where it reads .cargo/config.toml: the build settings
# there (CMAKE_TOOLCHAIN_FILE, MACOSX_DEPLOYMENT_TARGET, LIBSQLITE3_FLAGS) are set by no
# step here.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Format, lints and licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      # Licences, advisories, bans and sources, against deny.toml. Clippy runs in each Tests
      # job: the code of each system is linted only on it.
      - name: Dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The action's own Rust is older than the workspace's.
          rust-version: stable

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # A cold build compiles the workspace three times (clippy, tests, release) and, on
    # Windows, libheif with vcpkg first.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The build inputs of each system (AGENTS.md, spec §11.1).
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config nasm libde265-dev libegl1 zenity

      - name: Where vcpkg goes (Windows)
        id: vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        # The default root of scripts/windows-heif.ps1.
        run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$(Join-Path $env:LOCALAPPDATA 'photostacker\vcpkg')"
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg.outputs.root }}
          # The script pins the vcpkg commit and the two libraries' versions.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/windows-heif.ps1') }}
      - name: libheif and libde265 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # In this process, the script's output is the root alone; what it says goes to the host.
          $root = @(& ./scripts/windows-heif.ps1)[-1]
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "scripts/windows-heif.ps1 gave '$root', which is not a folder"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"

      - name: cmake and pkg-config (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          missing=
          command -v cmake >/dev/null 2>&1 || missing="$missing cmake"
          command -v pkg-config >/dev/null 2>&1 || missing="$missing pkgconf"
          if [ -n "$missing" ]; then
            echo "Installing with Homebrew:$missing"
            # shellcheck disable=SC2086 # one word per formula
            brew install $missing
          fi
          cmake --version | sed -n 1p
          echo "pkg-config $(pkg-config --version)"
      - name: Cache libde265 (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libde265
          # The script pins libde265's release; the build is for this runner's architecture.
          key: libde265-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/libde265.sh') }}
      - name: libde265 (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$RUNNER_TEMP/libde265"
          scripts/libde265.sh "$prefix"
          # libheif's cmake build finds the static libde265 there, and only there.
          echo "CMAKE_PREFIX_PATH=$prefix" >>"$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig" >>"$GITHUB_ENV"

      # ONNX Runtime, which the model tests load from ORT_DYLIB_PATH (spec §8.3).
      - name: Where ONNX Runtime goes
        id: ort
        run: |
          library=$(scripts/ort.sh --where)
          if [ -z "$library" ]; then
            echo "::error::scripts/onnxruntime.tsv pins no ONNX Runtime build for this runner"
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            library=$(cygpath -u "$library")
          fi
          # The table's library is lib/<file>, in the folder the archive unpacks to.
          home=$(dirname "$(dirname "$library")")
          if [ "$RUNNER_OS" = Windows ]; then
            home=$(cygpath -w "$home")
          fi
          echo "home=$home" >>"$GITHUB_OUTPUT"
      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ort.outputs.home }}
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/onnxruntime.tsv') }}
      - name: ONNX Runtime
        run: |
          library=$(scripts/ort.sh)
          echo "ORT_DYLIB_PATH=$library" >>"$GITHUB_ENV"

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
          fallback: none

      # dinov2-small, which a model test runs, from PHOTOSTACKER_MODELS_DIR: downloaded by the
      # tool itself into <data folder>/models, the registry's pinned file (spec §8.1).
      - name: Where the model goes
        run: echo "PHOTOSTACKER_MODELS_DIR=$RUNNER_TEMP/photostacker-data/models" >>"$GITHUB_ENV"
      - name: Cache the model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PHOTOSTACKER_MODELS_DIR }}
          # The registry pins the model's address and SHA-256.
          key: dinov2-small-${{ runner.os }}-${{ hashFiles('crates/core/src/models/registry.rs') }}
      - name: Download the model
        if: steps.model.outputs.cache-hit != 'true'
        env:
          PHOTOSTACKER_DATA_DIR: ${{ runner.temp }}/photostacker-data
        run: cargo run --locked -p photostacker-cli -- models download dinov2-small

      # A test that finds no ONNX Runtime, no model or fewer than three cores passes with a
      # "skipped:" line; here that is a failure instead.
      - name: Nothing for the tests to skip
        run: |
          status=0
          library=${ORT_DYLIB_PATH:-}
          model="${PHOTOSTACKER_MODELS_DIR:-}/dinov2-small/model.onnx"
          if [ "$RUNNER_OS" = Windows ]; then
            if [ -n "$library" ]; then library=$(cygpath -u "$library"); fi
            model=$(cygpath -u "$model")
          fi
          if [ -z "$library" ] || [ ! -f "$library" ]; then
            echo "::error::ORT_DYLIB_PATH (${ORT_DYLIB_PATH:-not set}) names no file: the tests that run ONNX Runtime would be skipped"
            status=1
          fi
          if [ ! -s "$model" ]; then
            echo "::error::there is no model file at $model: the dinov2-small test would be skipped"
            status=1
          fi
          cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-}")
          case "$cores" in
            '' | *[!0-9]*)
              echo "::error::could not count this runner's logical cores (found \"$cores\")"
              exit 1
              ;;
          esac
          if [ "$cores" -lt 3 ]; then
            echo "::error::this runner has $cores logical cores, and the screens that hold a scan need 3: their tests would be skipped"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "ONNX Runtime at $ORT_DYLIB_PATH, the model at $model, $cores logical cores"
          fi
          exit "$status"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked
      - name: Tests without ml and heic (Linux)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --locked --no-default-features
      # The tests run in the test profile; this builds the executables users get.
      - name: Release build
        run: cargo build --release --locked -p photostacker-ui -p photostacker-cli

      # The package check reads the deployment target of the executables only, which a
      # static library compiled for a newer macOS would not change. libde265.sh checks
      # libde265's objects; this checks libheif's, which cmake built through libheif-sys.
      - name: libheif's objects need macOS 11.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          target=11.0
          archives=$(find target -path '*/build/libheif-sys-*/out/*' -name libheif.a 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "::error::found no libheif.a under target/*/build/libheif-sys-*/out/"
            exit 1
          fi
          status=0
          while IFS= read -r archive; do
            # Each object, with LC_BUILD_VERSION's minos or LC_VERSION_MIN_MACOSX's version;
            # a member with no load command (the symbol table) is no object.
            report=$(otool -l "$archive" | awk '
              function done() {
                if (member != "" && commands) print member, (minos == "" ? "none" : minos)
              }
              /\(.*\):$/ { done(); member = $0; sub(/^.*\(/, "", member); sub(/\):$/, "", member); commands = 0; minos = ""; next }
              $1 == "Load" && $2 == "command" { commands = 1 }
              $1 == "cmd" { cmd = $2 }
              minos == "" && cmd == "LC_BUILD_VERSION" && $1 == "minos" { minos = $2 }
              minos == "" && cmd == "LC_VERSION_MIN_MACOSX" && $1 == "version" { minos = $2 }
              END { done() }')
            objects=$(printf '%s\n' "$report" | grep -c . || true)
            wrong=$(printf '%s\n' "$report" | awk -v target="$target" '$2 != target')
            if [ "$objects" = 0 ]; then
              echo "::error::otool -l found no object in $archive"
              status=1
            elif [ -n "$wrong" ]; then
              echo "::error::objects in $archive need another macOS than $target (object, minimum macOS):"
              printf '%s\n' "$wrong"
              status=1
            else
              echo "ok: all $objects objects in $archive need macOS $target"
            fi
          done <<EOF
          $archives
          EOF
          exit "$status"

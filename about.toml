# cargo-about's configuration: `just licences` writes the licence of every
# crate built into the shipped binaries, with its text, to
# THIRD-PARTY-LICENSES.md (spec §11.3). What is not a crate (libheif, libde265,
# ONNX Runtime, the fonts that are files of their own) is in
# THIRD-PARTY-NOTICES.md.

# The licences deny.toml allows, in the order a crate that offers a choice is
# taken under: the first one its expression allows is the one whose text ships.
# The LGPL is accepted crate by crate below: LGPL-2.1 for rawler, LGPL-3.0 for
# the libheif that libheif-sys builds.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

# The four targets the releases ship, as in deny.toml.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Neither kind is built into a binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates are Photostacker itself, under its own LICENSE;
# none is published (`publish = false`), so none is listed.
private = { ignore = true }

# chrono puts its two licence texts in one file; the tool's own clarification
# splits them.
workarounds = ["chrono"]

# --- Crate by crate ---------------------------------------------------------
#
# Each clarification below names a licence file the crate ships that the tool
# does not recognise with confidence, so that file's text, with its copyright
# lines, ships instead of the licence's standard text. The checksum is the
# file's SHA-256, byte for byte: a crate whose file changes no longer matches,
# and the tool says so. Crates that ship no licence file at all get the
# licence's standard text; the generated file says which.

# The RAW decoder (spec §3): the one LGPL crate, as in deny.toml.
[rawler]
accepted = ["LGPL-2.1"]

[rawler.clarify]
license = "LGPL-2.1"

[[rawler.clarify.files]]
path = "LICENSE"
checksum = "4bb33cc4cd956b56b779b501f18cae46a9e26f8c8500cca86ed758b8bc5e1788"

# The crate is MIT, and it holds libheif's source (LGPL-3.0 or later), which
# the build compiles into the binaries on Linux and macOS; the Windows build
# links vcpkg's libheif instead, under the same licence. So the crate is listed
# under both, with libheif's own COPYING (which also holds the GPL-3.0 the LGPL
# builds on). deny.toml needs no entry: it reads only the declared MIT.
[libheif-sys]
accepted = ["LGPL-3.0-or-later"]

[libheif-sys.clarify]
license = "MIT AND LGPL-3.0-or-later"

[[libheif-sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "7884c212eb49acf7c224e594e4c872d448a8703f6f3d3e640336ad5754dc2556"

[[libheif-sys.clarify.files]]
path = "vendor/libheif/COPYING"
license = "LGPL-3.0-or-later"
checksum = "fa81ce652315b013359d6e8e4744335f31a50c7c192907176d3632f78a3b4596"

# Two zlib notices: the Rust port's and the original C code's.
[adler32.clarify]
license = "Zlib"

[[adler32.clarify.files]]
path = "LICENSE"
checksum = "f5af8beef8f5f88f1b78494703bbfa019c4f3630ac111344390d6f9975ab22ed"


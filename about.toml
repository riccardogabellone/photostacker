# cargo-about's configuration: `just licences` writes the licence of every
# crate built into the shipped binaries, with its text, to
# THIRD-PARTY-LICENSES.md (spec §11.3). What is not a crate (libheif, libde265,
# ONNX Runtime, the fonts that are files of their own) is in
# THIRD-PARTY-NOTICES.md.

# The licences deny.toml allows, in the order a crate that offers a choice is
# taken under: the first one its expression allows is the one whose text ships.
# The LGPL is accepted crate by crate below: LGPL-2.1 for rawler, LGPL-3.0 for
# the libheif that libheif-sys builds.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

# The four targets the releases ship, as in deny.toml.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Neither kind is built into a binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates are Photostacker itself, under its own LICENSE;
# none is published (`publish = false`), so none is listed.
private = { ignore = true }

# chrono puts its two licence texts in one file; the tool's own clarification
# splits them.
workarounds = ["chrono"]

# --- Crate by crate ---------------------------------------------------------
#
# Each clarification names the licence file whose text ships for the crate,
# with its copyright lines, instead of the licence's standard text:
# - `files`: a file the crate ships that the tool does not recognise with
#   confidence;
# - `git`: for a crate that ships none, the file in its repository (path from
#   the repository's root) at the commit the crate was published from, which
#   the crate's `.cargo_vcs_info.json` names, or at another commit named by
#   `override-git-commit` where that one cannot be used (each case says why).
#   These are fetched from GitHub, so `just licences` needs the network.
# The checksum is the file's SHA-256, byte for byte: a crate whose file changes
# no longer matches, and the tool says so. A clarification applies to every
# version of a crate's name: where two versions are built in and only one has
# the file at its commit, the tool warns that the other does not match, and
# that one keeps the standard text. A crate keeps the licence's standard text
# only when it was published without a licence file and its repository held
# no licence text at the commit it was published from, and no clarification
# can give it one; each is named at the end of this file, and the generated
# file says which, with the authors each declares.

# The RAW decoder (spec §3): the one LGPL crate, as in deny.toml.
[rawler]
accepted = ["LGPL-2.1"]

[rawler.clarify]
license = "LGPL-2.1"

[[rawler.clarify.files]]
path = "LICENSE"
checksum = "4bb33cc4cd956b56b779b501f18cae46a9e26f8c8500cca86ed758b8bc5e1788"

# The crate is MIT, and it holds libheif's source (LGPL-3.0 or later), which
# the build compiles into the binaries on Linux and macOS; the Windows build
# links vcpkg's libheif instead, under the same licence. So the crate is listed
# under both, with libheif's own COPYING (which also holds the GPL-3.0 the LGPL
# builds on). deny.toml needs no entry: it reads only the declared MIT.
[libheif-sys]
